name: AIO Guard v18.2 510-matrix cancellation native QA

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: aio-v182-matrix-nikita-qa-owned
  cancel-in-progress: false

jobs:
  windows-qa:
    if: >-
      github.repository == 'jumonja-maker/A.I.O' &&
      github.actor == 'jumonja-maker' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'aio-v182-matrix-qa-approved-once' &&
      github.event.pull_request.user.login == 'jumonja-maker' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/guard-v182-matrix-progress-cancel-20261025' &&
      github.event.pull_request.base.ref == 'fix/guard-v182-bulk-preflight-and-dbf-20261025'
    runs-on: [self-hosted, Windows, X64, local-d-manual]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_INDEX: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
      AIO_BLACKBOX_EVENTS: ''
    steps:
      - name: Verify restricted owner-operated Windows runner
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'NIKITA' -or $env:RUNNER_OS -cne 'Windows' -or $env:USERNAME -ine 'aio-runner') { throw 'Unexpected runner' }
          $principal=New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Elevated QA not permitted' }
          foreach($key in @('GITHUB_WORKSPACE','RUNNER_TEMP','TEMP','TMP')) {
            $value=[Environment]::GetEnvironmentVariable($key)
            if ([string]::IsNullOrWhiteSpace($value) -or -not [IO.Path]::GetFullPath($value).StartsWith('D:\',[StringComparison]::OrdinalIgnoreCase)) { throw ('Path not D: '+$key) }
          }

      - name: Checkout frozen diagnostic PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: jumonja-maker/A.I.O
          ref: ${{ github.event.pull_request.head.sha }}
          path: aio-v182-matrix-qa-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          clean: true

      - name: Verify QA dependencies and source revision
        working-directory: aio-v182-matrix-qa-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $wanted='${{ github.event.pull_request.head.sha }}'
          # NIKITA uses GitHub REST archive fallback and has no git.exe.
          if ($wanted.Length -ne 40 -or $wanted -cnotmatch '^[0-9a-f]{40}$') { throw 'Untrusted source revision' }
          Write-Host ('AIO_TESTED_SOURCE_REF='+$wanted)
          $python='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\Scripts\python.exe'
          $marker='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\.00aio-test-only-venv.txt'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf) -or -not (Test-Path -LiteralPath $marker -PathType Leaf) -or (Get-Content -LiteralPath $marker -Raw).Trim() -cne '00AIO NIKITA ISOLATED DOCX PDF QA PY311 QT6103') { throw 'Unapproved Python environment' }
          & $python -c 'import sys,PySide6.QtWebEngineWidgets,PySide6.QtPdf;assert sys.version_info[:2]==(3,11)'
          if ($LASTEXITCODE -ne 0) { throw 'Python/Qt dependencies unavailable' }
          'AIO_QA_PYTHON='+$python | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $engine='D:\LBR\program\soffice.com'
          if (-not (Test-Path -LiteralPath $engine -PathType Leaf) -or -not (Test-Path -LiteralPath 'D:\LBR\program\python.exe' -PathType Leaf)) { throw 'Approved full LibreOffice unavailable' }
          'AIO_QA_ENGINE='+$engine | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $node=Get-Command node -ErrorAction SilentlyContinue
          if ($node) {$node=$node.Source} else {
            $runnerRoot=Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)
            $candidates=@((Join-Path $runnerRoot 'externals\node24\bin\node.exe'),(Join-Path $runnerRoot 'externals\node20\bin\node.exe'),'D:\AIO-Lab\nodejs\node.exe')
            $found=@($candidates | Where-Object {Test-Path -LiteralPath $_ -PathType Leaf} | Select-Object -First 1)
            if ($found.Count -ne 1) {throw 'Offline Node not found'}
            $node=$found[0]
          }
          'AIO_QA_NODE='+$node | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          # Python HTTP+DOM regression uses shutil.which('node'): expose the
          # approved offline executable to next steps, not only to direct calls.
          [IO.Path]::GetDirectoryName($node) | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          # Use the repo's signed/manifest-verified offline QA dependency
          # bundle. NIKITA has no global linkedom: never npm/pip install.
          $deps=Join-Path $env:RUNNER_TEMP ('aio-v182-matrix-deps-${{ github.run_id }}-${{ github.run_attempt }}')
          & $python tools/qa/guard_v17_test_dependencies.py --output $deps --github-env
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $deps 'node_modules\linkedom\esm\index.js') -PathType Leaf)) {throw 'Pinned offline QA dependency verification failed'}

      - name: Compile and run regression including 510-file UI
        working-directory: aio-v182-matrix-qa-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          & $env:AIO_QA_PYTHON -m compileall -q app_backend tests tools/qa
          if ($LASTEXITCODE -ne 0) {throw 'PY_COMPILE=FAIL'}
          & $env:AIO_QA_PYTHON -m unittest discover -s tests -p 'test_guard_v182_bulk_and_dbf.py' -v
          if ($LASTEXITCODE -ne 0) {throw 'TARGETED_V182=FAIL'}
          Write-Host 'TARGETED_V182=PASS'
          & $env:AIO_QA_PYTHON -m unittest discover -s tests -p 'test_guard_v182_matrix_stage.py' -v
          if ($LASTEXITCODE -ne 0) {throw 'TARGETED_MATRIX_CANCEL=FAIL'}
          Write-Host 'TARGETED_MATRIX_CANCEL=PASS'
          foreach($test in @('tests\guard_bridge_contracts.mjs','tests\guard_large_ui_v13.mjs')) {
            & $env:AIO_QA_NODE $test
            if ($LASTEXITCODE -ne 0) {throw ('DOM_TEST_FAILED='+$test)}
          }
          Write-Host 'BRIDGE_DOM=PASS;LIVE_HTTP_QUEUE_DOM=NOT_RUN_REQUIRES_TEST_SERVER'
          & $env:AIO_QA_PYTHON -m unittest discover -s tests -p 'test_*.py' -q
          if ($LASTEXITCODE -ne 0) {throw 'PYTHON_REGRESSION=FAIL'}
          Write-Host 'PYTHON_REGRESSION=PASS'

      - name: Exercise actual 510-file native preflight with visible progress
        working-directory: aio-v182-matrix-qa-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $out='D:\AIO-Lab\AIO-QA-Evidence\guard-v182-matrix-510-${{ github.run_id }}-${{ github.run_attempt }}'
          & $env:AIO_QA_PYTHON -u tools/qa/guard_v182_large_preflight_acceptance.py --engine $env:AIO_QA_ENGINE --output $out --count 510 --deadline-seconds 600
          if ($LASTEXITCODE -ne 0) { throw ('NATIVE_510_PREFLIGHT=FAIL;EVIDENCE='+$out) }
          Write-Host 'NATIVE_510_PREFLIGHT=PASS'
          Write-Host ('NATIVE_510_PREFLIGHT_EVIDENCE='+$out)

      - name: Native legacy CSV DBF acceptance twice
        working-directory: aio-v182-matrix-qa-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $base='D:\AIO-Lab\AIO-QA-Evidence\guard-v182-matrix-${{ github.run_id }}'
          foreach($i in @(1,2)) {
            $out=$base+'-native-v08-'+$i
            & $env:AIO_QA_PYTHON tools\qa\guard_v08_native_acceptance.py --output $out
            if ($LASTEXITCODE -ne 0) {throw ('NATIVE_V08_ATTEMPT_'+$i+'=FAIL')}
            Write-Host ('NATIVE_V08_ATTEMPT_'+$i+'=PASS')
          }
          Write-Host 'CSV_DBF_NATIVE_QA=2_PASS_ATTEMPTS_NOT_FULLTEST'
          Write-Host 'MAIN=UNCHANGED;FULLTEST_510=NOT_RUN;INSTALLER_QA=NOT_RUN'
