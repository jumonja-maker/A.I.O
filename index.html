<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>All in One помощник — UI v1.2</title>
  <link rel="stylesheet" href="src/styles.css">
  <link rel="stylesheet" href="src/aio-elva-v13-happy.css">
  <link rel="icon" id="app-favicon" type="image/webp" href="assets/brand/elva-v13-happy-thumb.webp">
  <script src="src/registry.js" defer></script>
  <script src="src/excel-tool.js" defer></script>
  <script src="src/bridge.js" defer></script>
  <script src="src/converter-bridge.js" defer></script>
  <link rel="stylesheet" href="addons/file-converter/file-converter.css">
  <link rel="stylesheet" href="addons/file-converter/aio-file-type-filter.css">
  <link rel="stylesheet" href="addons/file-converter/aio-file-progress.css">
  <link rel="stylesheet" href="addons/file-converter/aio-converter-right-badges.css">
  <script src="addons/file-converter/aio-file-type-filter.js" defer></script>
  <script src="addons/file-converter/aio-file-progress.js" defer></script>
  <script src="addons/file-converter/aio-converter-issues.js" defer></script>
  <script src="addons/file-converter/file-converter.js" defer></script>
  <link rel="stylesheet" href="addons/file-converter/qa-float.css">
  <link rel="stylesheet" href="addons/file-converter/qa-stable-controls.css">
  <script src="src/converter-float.js" defer></script>
  <script src="src/branding.js" defer></script>
  <script src="src/app.js" defer></script>
  <link rel="stylesheet" href="addons/file-converter/aio-approved-branding.css">
  <script src="addons/file-converter/aio-approved-branding.js" defer></script>
  <link rel="stylesheet" href="addons/github-link/github-link.css">
  <link rel="stylesheet" href="addons/file-converter/aio-static-geometry.css">
  <link rel="stylesheet" href="addons/file-converter/aio-issues-popover.css">
  <link rel="stylesheet" href="addons/file-converter/aio-selection-controls.css">
  <link rel="stylesheet" href="addons/file-converter/aio-viewport-safety.css">
  <script src="addons/github-link/github-link.js" defer></script>
</head>
<body>
  <!-- Системную строку заголовка (свернуть/развернуть/закрыть) предоставляет Windows-хост. -->
  <div class="app-shell">
    <header class="app-header">
      <div class="aio-v13-brand">
        <span class="aio-v13-elva-badge" aria-hidden="true">
          <img src="assets/brand/elva-v13-happy-thumb.webp" alt="" width="58" height="58" decoding="async">
        </span>
        <span class="app-name">A.I.O</span>
      </div>
    </header>
    <div class="app-layout">
      <aside class="sidebar" aria-label="Панель инструментов">
        <label class="search-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
          <span class="sr-only">Поиск инструмента</span>
          <input id="tool-search" type="search" placeholder="Найти инструмент" autocomplete="off">
        </label>
        <nav id="tool-nav" class="tool-nav" aria-label="Инструменты"></nav>
        <p id="no-tools" class="no-tools" hidden>Инструмент не найден</p>
        <div class="sidebar-bottom">
          <button id="check-updates" type="button" class="update-button" title="Проверить обновления приложения">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 12.3-2L20 12M4 12l2.2 5A7 7 0 0 0 18.5 15"/></svg>
            <span>Обновить</span>
          </button>
          <button id="theme-toggle" type="button" class="theme-toggle" aria-label="Включить тёмную тему" title="Переключить тему" aria-pressed="false">
            <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 15.1A8.3 8.3 0 0 1 8.9 3.7a8.5 8.5 0 1 0 11.4 11.4Z"/></svg>
            <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
          </button>
        </div>
      </aside>
      <main id="tool-root" class="workspace" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
