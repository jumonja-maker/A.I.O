name: AIO isolated M04 report history acceptance
on:
  push:
    branches: ['work/history-m04-20261030']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependencies and canonical disposable paths
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          npm install --no-save --ignore-scripts --package-lock=false linkedom@0.18.12
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()/'aio-history-tests'
          p.mkdir(exist_ok=False)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              for key in ('TEMP','TMP','TMPDIR'):f.write(key+'='+str(p)+'\n')
              f.write('AIO_DOM_MODULE='+str(pathlib.Path('node_modules/linkedom/esm/index.js').resolve())+'\n')
          PY
      - name: Prepare exact-base product candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/qa/_prepare_history_patch.py prepare
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_conversion_history.py')
          s=p.read_text(encoding='utf-8')
          old="        with ConverterGuard(adapter=FakeAdapter()) as guard:\n            self.assertFalse(guard.history_list()['enabled'])"
          new="        guard=ConverterGuard(adapter=FakeAdapter());self.addCleanup(guard.close)\n        self.assertFalse(guard.history_list()['enabled'])"
          assert s.count(old)==1
          s=s.replace(old,new)
          assert s.count('with sqlite3.connect(self.history.path) as db:')==5
          s=s.replace('from copy import deepcopy','from contextlib import closing\nfrom copy import deepcopy')
          s=s.replace('with sqlite3.connect(self.history.path) as db:', 'with closing(sqlite3.connect(self.history.path)) as db, db:')
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          python tools/qa/_finalize_history_candidate.py
          python -m compileall -q app_backend tests tools/qa/_prepare_history_patch.py
          node --check src/conversion-history.js
          git diff --check
      - name: New history store core HTTP and DOM acceptance
        shell: bash
        run: python -m unittest discover -s tests -p test_conversion_history.py -v
      - name: Preserve existing ownership save ZIP and UI tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_converter_guard_v02.py -v
          python -m unittest discover -s tests -p test_save_snapshot_report.py -v
          python -m unittest discover -s tests -p test_archive_readback.py -v
          python -m unittest discover -s tests -p test_selection_controls.py -v
      - name: Review integrated source changes
        shell: bash
        run: git diff --stat && git diff -- app_backend/converter_guard/core.py app_backend/converter_guard/http_api.py app_backend/server.py index.html src/guard-queue.js
      - name: Publish tested unreferenced blobs only
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/qa/_prepare_history_patch.py publish
