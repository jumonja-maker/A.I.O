name: BLACK.BOX telemetry contract (A.I.O isolated QA)

on:
  pull_request:
    paths:
      - "app_backend/blackbox_telemetry.py"
      - "app_backend/converter_guard/**"
      - "app_backend/converter_transport.py"
      - "app_backend/server.py"
      - "tests/test_blackbox_telemetry.py"
      - "tests/test_blackbox_audit_v02.py"
      - ".github/workflows/blackbox-telemetry-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry-contract:
    if: >-
      github.repository == 'jumonja-maker/A.I.O' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'jumonja-maker'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile diagnostic source and integrations
        run: |
          python -m py_compile app_backend/blackbox_telemetry.py \
            app_backend/converter_guard/core.py \
            app_backend/converter_transport.py \
            app_backend/server.py
      - name: Check BLACK.BOX event emitter contracts and Guard isolation
        run: |
          python -m unittest discover -s tests -p 'test_blackbox_telemetry.py' -v
          python -m unittest discover -s tests -p 'test_blackbox_audit_v02.py' -v
