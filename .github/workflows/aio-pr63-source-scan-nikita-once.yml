name: AIO PR63 source contract pinned NIKITA regression

# One-shot QA for PR63 owner branch. No install/build/package/release/uploads.
on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: aio-pr63-source-contract-nikita-once
  cancel-in-progress: false

env:
  AIO_QA_SOURCE_SHA: '699a814ae98d93f8df9b61faa182ec6a639f64ed'
  AIO_QA_TREE_SHA: '401a83927d4a3555c8a200bf3d998df50ed31e8e'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PIP_NO_INDEX: '1'
  PIP_NO_INPUT: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  AIO_BLACKBOX_EVENTS: ''
  QT_QPA_PLATFORM: offscreen
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  windows-source-scan-qa:
    if: >-
      github.repository == 'jumonja-maker/A.I.O' &&
      github.actor == 'jumonja-maker' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.number == 63 &&
      github.event.pull_request.user.login == 'jumonja-maker' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'patch/guard-v22-source-scan-20261026' &&
      github.event.pull_request.base.ref == 'build/guard-v21-windows-nikita-20261026'
    runs-on: [self-hosted, Windows, X64, local-d-manual]
    timeout-minutes: 50
    defaults:
      run:
        shell: powershell
    steps:
      - name: Verify restricted Windows runner and isolated paths
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'NIKITA' -or $env:RUNNER_OS -cne 'Windows' -or $env:USERNAME -ine 'aio-runner') { throw 'Wrong QA runner identity' }
          $principal=New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Elevated QA forbidden' }
          foreach($name in @('GITHUB_WORKSPACE','RUNNER_TEMP','TEMP','TMP')) {
            $path=[Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($path) -or -not [IO.Path]::GetFullPath($path).StartsWith('D:\',[StringComparison]::OrdinalIgnoreCase)) { throw ('Unsafe QA path '+$name) }
          }
          if ((Get-PSDrive D -PSProvider FileSystem).Free -lt 30GB -or (Get-PSDrive C -PSProvider FileSystem).Free -lt 10GB) { throw 'Insufficient disk free; no cleanup attempted' }
          $target=Join-Path $env:GITHUB_WORKSPACE 'aio-pr63-scan-source-${{ github.run_id }}-${{ github.run_attempt }}'
          if (Test-Path -LiteralPath $target) { throw 'QA source destination exists; refusing overwrite' }

      - name: Checkout exact immutable reviewed scanner candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: jumonja-maker/A.I.O
          ref: 699a814ae98d93f8df9b61faa182ec6a639f64ed
          path: aio-pr63-scan-source-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify Git tree and existing approved offline dependencies
        working-directory: aio-pr63-scan-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $python='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\Scripts\python.exe'
          $marker='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\.00aio-test-only-venv.txt'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf) -or -not (Test-Path -LiteralPath $marker -PathType Leaf) -or (Get-Content -LiteralPath $marker -Raw).Trim() -cne '00AIO NIKITA ISOLATED DOCX PDF QA PY311 QT6103') { throw 'Approved QA environment not found' }
          $script=@'
          import hashlib, os
          from pathlib import Path
          def tree(folder):
              entries=[]
              for child in folder.iterdir():
                  if child.name=='.git': continue
                  name=child.name.encode('utf-8')
                  if child.is_symlink():raise ValueError('Unexpected symlink')
                  if child.is_dir():mode,oid,key=b'40000',tree(child),name+b'/'
                  elif child.is_file():
                      data=child.read_bytes();mode=b'100644';key=name
                      oid=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).digest()
                  else:raise ValueError('Unexpected file type')
                  entries.append((key,mode+b' '+name+b'\0'+oid))
              raw=b''.join(x for _,x in sorted(entries,key=lambda x:x[0]))
              return hashlib.sha1(b'tree '+str(len(raw)).encode()+b'\0'+raw).digest()
          actual=tree(Path.cwd()).hex()
          print('PINNED_SOURCE_TREE='+actual)
          if actual != os.environ['AIO_QA_TREE_SHA']:raise SystemExit('UNEXPECTED_SOURCE_TREE')
          '@
          & $python -c $script
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Git tree check failed' }
          & $python -c 'import sys;import PySide6.QtWebEngineWidgets, pypdf, openpyxl; assert sys.version_info[:2]==(3,11)'
          if ($LASTEXITCODE -ne 0) { throw 'Offline Python or Qt dependency missing' }
          'AIO_QA_PYTHON='+$python | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $node=Get-Command node -ErrorAction SilentlyContinue
          if ($node) {$node=$node.Source} else {
            $runnerRoot=Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)
            $found=@(@((Join-Path $runnerRoot 'externals\node24\bin\node.exe'),(Join-Path $runnerRoot 'externals\node20\bin\node.exe'),'D:\AIO-Lab\nodejs\node.exe') | Where-Object {Test-Path -LiteralPath $_ -PathType Leaf} | Select-Object -First 1)
            if ($found.Count -ne 1) { throw 'Offline Node unavailable' };$node=$found[0]
          }
          [IO.Path]::GetDirectoryName($node) | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $doms=@((Join-Path $env:GITHUB_WORKSPACE 'node_modules\linkedom\esm\index.js'),'D:\AIO-Lab\node_modules\linkedom\esm\index.js','D:\AIO-Lab\AIO-QA-Env\node_modules\linkedom\esm\index.js')
          $dom=@($doms | Where-Object {Test-Path -LiteralPath $_ -PathType Leaf} | Select-Object -First 1)
          if ($dom.Count -eq 1) {'AIO_DOM_MODULE='+$dom[0] | Out-File $env:GITHUB_ENV -Encoding utf8 -Append}
          $engine=$null
          foreach($base in @('D:\LBR\LibreOffice','D:\LBR','D:\AIO-Lab\LibreOffice','C:\Program Files\LibreOffice')) {
            foreach($suffix in @('program\soffice.com','program\soffice.exe')) {
              $candidate=Join-Path $base $suffix
              if ((Test-Path -LiteralPath $candidate -PathType Leaf) -and
                  (Test-Path -LiteralPath (Join-Path $base 'program\soffice.bin') -PathType Leaf) -and
                  (Test-Path -LiteralPath (Join-Path $base 'share') -PathType Container)) {$engine=$candidate;break}
            }
            if ($engine) { break }
          }
          if (-not $engine) { throw 'Complete installed LibreOffice missing' }
          'AIO_QA_ENGINE='+$engine | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'AIO_LIBREOFFICE='+$engine | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare isolated offline test-only dependencies
        working-directory: aio-pr63-scan-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:RUNNER_TEMP 'aio-pr63-source-deps-${{ github.run_id }}-${{ github.run_attempt }}'
          & $env:AIO_QA_PYTHON tools/qa/guard_v17_test_dependencies.py --output $target --github-env
          if ($LASTEXITCODE -ne 0) { throw 'Offline QA dependencies failed' }

      - name: Test new source scan and existing v20 source contracts
        working-directory: aio-pr63-scan-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          & $env:AIO_QA_PYTHON -m unittest discover -s tests -p test_guard_source_scan_v22.py -v
          if ($LASTEXITCODE -ne 0) { throw 'PR63 scanner regression' }
          & $env:AIO_QA_PYTHON -m unittest discover -s tests -p test_guard_source_contract_v20.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original v20 source contracts regressed' }

      - name: Full Windows source Qt DOM regression
        working-directory: aio-pr63-scan-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'aio-pr63-source-unit-${{ github.run_id }}-${{ github.run_attempt }}.json'
          $env:AIO_LO_QA_MUST_HAVE_ENGINE='1'
          $env:AIO_QT_SAVE_QA='1'
          & $env:AIO_QA_PYTHON tools/qa/guard_v17_selfhosted_acceptance.py --unit-report $out
          if ($LASTEXITCODE -ne 0) { throw 'Full source regression failed' }
          Get-Content -LiteralPath $out -Raw | Write-Host

      - name: Native v20 regression and strict XLSX import
        working-directory: aio-pr63-scan-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'aio-pr63-native-${{ github.run_id }}-${{ github.run_attempt }}'
          & $env:AIO_QA_PYTHON tools/qa/guard_v20_native_acceptance.py --output (Join-Path $out 'v20') --executable $env:AIO_QA_ENGINE --require-mode native_uno
          if ($LASTEXITCODE -ne 0) { throw 'v20 native regression' }
          & $env:AIO_QA_PYTHON tools/qa/guard_v21_xlsx_acceptance.py --output (Join-Path $out 'xlsx') --executable $env:AIO_QA_ENGINE --require-mode native_uno
          if ($LASTEXITCODE -ne 0) { throw 'v21 strict/stale XLSX native regression' }

      - name: Native queue save CSV to DBF regression
        working-directory: aio-pr63-scan-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'aio-pr63-v08-queue-${{ github.run_id }}-${{ github.run_attempt }}'
          & $env:AIO_QA_PYTHON tools/qa/guard_v08_native_acceptance.py --output $out --compare-cli
          if ($LASTEXITCODE -ne 0) { throw 'Native queue/save regression' }

      - name: Report reviewed immutable source and stage result
        if: always()
        run: |
          Write-Host ('TESTED_SOURCE='+$env:AIO_QA_SOURCE_SHA)
          Write-Host ('TESTED_TREE='+$env:AIO_QA_TREE_SHA)
          Write-Host ('ONLY_SOURCE_TESTS=NO_PACKAGING;FULLTEST=NOT_RUN;RELEASE=NOT_RUN;MAIN=UNCHANGED')
