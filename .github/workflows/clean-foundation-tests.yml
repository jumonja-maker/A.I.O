name: A.I.O clean foundation (Excel and UI)
on:
  pull_request:
    paths:
      - "src/**"
      - "addons/**"
      - "assets/**"
      - "app_backend/**"
      - "tests/**"
      - "index.html"
      - ".github/workflows/clean-foundation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    if: >-
      github.repository == 'jumonja-maker/A.I.O' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'jumonja-maker'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install only isolated Excel test dependency
        run: python -m pip install 'openpyxl>=3.1.2,<3.2'
      - name: Compile source and validate JavaScript parse
        run: |
          python -m compileall -q app_backend launcher.py
          node --check src/app.js
          node --check src/excel-tool.js
          node --check src/converter-bridge.js
          node --check src/bridge.js
      - name: Preserve original Excel regression suite
        run: python -m unittest discover -s tests -p 'test_excel.py' -v
      - name: Verify shell, visual designer, Guard boundary and Excel API
        run: python -m unittest discover -s tests -p 'test_clean_foundation.py' -v
