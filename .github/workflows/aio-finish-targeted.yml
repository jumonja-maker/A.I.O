name: AIO targeted converter finish checks
on:
  push:
    branches: [qa/converter-finish-targeted-20261109, qa/converter-finish-native-diagnostic-20261109]
permissions:
  contents: read
concurrency:
  group: aio-finish-targeted-${{ github.ref_name }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
  QT_QPA_PLATFORM: offscreen
  QT_OPENGL: software
  AIO_LO_QA_MUST_HAVE_ENGINE: '1'
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(contains(github.ref_name, 'native-diagnostic') && '["rare","macro","pct","compiler"]' || '["dbf","rare","macro","corpus","installed"]') }}
    name: Windows finish ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 30
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned current owner-provided synthetic corpus
        if: matrix.lane != 'compiler'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6a1a2571f67c1a8041ad28de290f4457b805d032
          path: _qa-current178
          sparse-checkout: qa-fixtures/current178
          persist-credentials: false
      - name: Canonical private temporary directory
        shell: bash
        run: |
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()/'aio-finish-temp'
          p.mkdir(exist_ok=False)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              for key in ('TEMP','TMP','TMPDIR'): f.write(key+'='+str(p)+'\n')
              f.write('AIO_QA_SOURCE_SHA='+os.environ['GITHUB_SHA']+'\n')
          PY
      - name: Verified runtime dependencies
        if: matrix.lane != 'compiler'
        shell: bash
        run: |
          set -euo pipefail
          python tools/build/verify_qa_dependency_lock.py --phase runtime --check-locks
          python tools/build/qa_wheels.py --phase runtime --wheelhouse "$RUNNER_TEMP/aio-qa-wheels"
          python tools/build/qa_sca.py --phase runtime --output build/aio-qa-sca-runtime.json
          python tools/build/verify_qa_dependency_lock.py --phase runtime --wheel-receipt build/aio-qa-wheels-runtime.json --sca-report build/aio-qa-sca-runtime.json
      - name: Verified native Windows engine
        if: matrix.lane != 'compiler'
        shell: pwsh
        run: ./tools/build/prepare-libreoffice.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'aio-engine-26.8.2')
      - name: Verify and extract exact 178 originals
        if: matrix.lane != 'compiler'
        shell: bash
        run: python tools/qa/prepare_current_corpus.py --data-root _qa-current178 --output "$RUNNER_TEMP/aio-current178"
      - name: Native compiler identity before any expensive packaging
        if: matrix.lane == 'compiler'
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from tools.build.build_completion_installer import compiler_identity
          data=compiler_identity(Path(r'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'))
          print('AIO_ISCC_IDENTITY='+json.dumps(data,ensure_ascii=True))
          (Path(os.environ['RUNNER_TEMP'])/'aio-compiler-identity.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Four exact PCT bitmap diagnostics
        if: matrix.lane == 'pct'
        shell: bash
        run: python tools/qa/completion_current_fidelity_native.py --input "$RUNNER_TEMP/aio-current178/originals" --output "$RUNNER_TEMP/aio-finish-fidelity178" --executable "$AIO_QA_ENGINE" --extensions pct
      - name: Exact decimal DBF and legacy preservation regressions
        if: matrix.lane == 'dbf'
        shell: bash
        run: |
          set -euo pipefail
          python tools/qa/completion_dbf_native.py --executable "$AIO_QA_ENGINE" --output "$RUNNER_TEMP/aio-completion-dbf" --require-uno
          python tools/qa/finish_dbf_numeric_native.py --executable "$AIO_QA_ENGINE" --output "$RUNNER_TEMP/aio-finish-dbf" --require-uno --corpus "$RUNNER_TEMP/aio-current178/originals"
      - name: Genuine report storage and real VBA projects
        if: matrix.lane == 'rare'
        shell: bash
        run: |
          set -euo pipefail
          python tools/qa/finish_m14_native.py --executable "$AIO_QA_ENGINE" --output "$RUNNER_TEMP/aio-finish-m14"
      - name: Genuine native VBA storage and expected loss checks
        if: matrix.lane == 'macro'
        shell: bash
        run: |
          set -euo pipefail
          python tools/qa/completion_macro_native.py --executable "$AIO_QA_ENGINE" --output "$RUNNER_TEMP/aio-finish-macros" --require-uno
      - name: Current 178 primary routes and independent targeted fidelity
        if: matrix.lane == 'corpus'
        shell: bash
        run: |
          set -euo pipefail
          python tools/qa/completion_current_corpus_native.py --input "$RUNNER_TEMP/aio-current178/originals" --provenance "$RUNNER_TEMP/aio-current178/provenance.json" --output "$RUNNER_TEMP/aio-finish-current178" --executable "$AIO_QA_ENGINE"
          python tools/qa/completion_current_fidelity_native.py --input "$RUNNER_TEMP/aio-current178/originals" --output "$RUNNER_TEMP/aio-finish-fidelity178" --executable "$AIO_QA_ENGINE"
      - name: Source-bound frozen build and real installed Windows desktop
        if: matrix.lane == 'installed'
        shell: bash
        run: |
          set -euo pipefail
          python tools/build/verify_qa_dependency_lock.py --phase build --check-locks
          python tools/build/qa_wheels.py --phase build --wheelhouse "$RUNNER_TEMP/aio-qa-wheels"
          python tools/build/qa_sca.py --phase build --output build/aio-qa-sca-build.json
          python tools/build/verify_qa_dependency_lock.py --phase build --wheel-receipt build/aio-qa-wheels-build.json --sca-report build/aio-qa-sca-build.json
          AIO_QA_REQUIRE_MANIFEST=1 python -m PyInstaller --noconfirm --clean AllInOne.spec
          python tools/build/build_completion_installer.py --iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' --payload dist/A.I.O --output "$RUNNER_TEMP/aio-installed-build" --source-sha "$AIO_QA_SOURCE_SHA"
          python tools/qa/completion_installed_windows.py --installer-receipt "$RUNNER_TEMP/aio-installed-build/installer-build.json" --output "$RUNNER_TEMP/aio-installed-acceptance" --source-sha "$AIO_QA_SOURCE_SHA"
      - name: Preserve exact evidence in logs
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          import base64
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for name in ('aio-completion-dbf/evidence.json','aio-finish-dbf/evidence.json','aio-finish-m14/evidence.json','aio-finish-macros/evidence.json','aio-finish-current178/evidence.json','aio-finish-fidelity178/evidence.json','aio-installed-build/installer-build.json','aio-installed-acceptance/evidence.json','aio-installed-acceptance/gui/evidence.json','aio-compiler-identity.json'):
              p=root/name
              if not p.is_file(): continue
              record=json.dumps({'file':name,**json.loads(p.read_text(encoding='utf-8'))},ensure_ascii=True)
              print('AIO_EVIDENCE='+record)
              chunks=[record[i:i+10000] for i in range(0,len(record),10000)]
              for index,part in enumerate(chunks):
                  print('AIO_EVIDENCE_CHUNK='+json.dumps({'file':name,'part':index,'total':len(chunks),'sha256':hashlib.sha256(record.encode('ascii')).hexdigest(),'data':part},ensure_ascii=True))
          for name in ('aio-installed-acceptance/gui/installed-saved.png','aio-installed-acceptance/gui/native-save-dialog.png'):
              p=root/name
              if not p.is_file(): continue
              raw=p.read_bytes()
              if len(raw)>2*1024*1024: raise ValueError('Screenshot budget exceeded')
              encoded=base64.b64encode(raw).decode('ascii')
              chunks=[encoded[i:i+12000] for i in range(0,len(encoded),12000)]
              for index,part in enumerate(chunks):
                  print('AIO_SCREENSHOT_CHUNK='+json.dumps({'file':name,'part':index,'total':len(chunks),'sha256':hashlib.sha256(raw).hexdigest(),'data':part},ensure_ascii=True))
          PY
