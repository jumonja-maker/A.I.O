name: Audit 101 isolated source workbench
on:
  push:
    branches: [fix/deep-audit-d01-d09-20261031]
    paths: ['tools/qa/apply_deep_audit_fix.py', 'tools/qa/deep_audit_methods.py', '.github/workflows/aio-audit-fix-workbench.yml']
permissions:
  contents: read
concurrency:
  group: audit-101-workbench
  cancel-in-progress: false
jobs:
  source:
    if: github.ref == 'refs/heads/fix/deep-audit-d01-d09-20261031'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.fix.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Guarded source edit
        id: fix
        shell: bash
        run: |
          set -euo pipefail
          python tools/qa/apply_deep_audit_fix.py
          python -m compileall -q app_backend tests
          git diff --check
          git diff --stat
          git add app_backend tests src
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Apply reviewed audit 101 source corrections and regression tests (QA only)'
            git push origin HEAD:refs/heads/fix/deep-audit-d01-d09-20261031
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  regressions:
    needs: [source]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verified runtime and isolated temporary directory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()/'audit101-temp'
          p.mkdir(exist_ok=False)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              for key in ('TEMP','TMP','TMPDIR'):
                  f.write(key+'='+str(p)+'\n')
          PY
          echo "AIO_QA_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python tools/build/verify_qa_dependency_lock.py --phase runtime --check-locks
          AIO_QA_SOURCE_SHA=$(git rev-parse HEAD) python tools/build/qa_wheels.py --phase runtime --wheelhouse "$RUNNER_TEMP/audit101-wheels"
          npm install --no-save --ignore-scripts --package-lock=false linkedom@0.18.12
          python -c "from pathlib import Path; print('AIO_DOM_MODULE='+str(Path('node_modules/linkedom/esm/index.js').resolve()))" >> "$GITHUB_ENV"
      - name: Audit regressions and related preservation contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_audit_101_fixes.py' -v
          python -m unittest discover -s tests -p 'test_m02_m30_recovery_save.py' -v
          python -m unittest discover -s tests -p 'test_legacy*.py' -v
          python -m unittest discover -s tests -p 'test_archive_readback.py' -v
          node --check src/legacy-recovery.js
      - name: Same-host quota benchmark (not a native conversion benchmark)
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,statistics,subprocess,tempfile,time,types
          from app_backend.legacy_storage_budget import measured_bytes
          old=types.ModuleType('app_backend.audit101_baseline_budget')
          old.__package__='app_backend'
          exec(subprocess.check_output(['git','show','97fabe65b64076dc8063e0813865ac70b42bfb14:app_backend/legacy_storage_budget.py']).decode(),old.__dict__)
          with tempfile.TemporaryDirectory() as folder:
              root=pathlib.Path(folder)
              for i in range(12000): (root/str(i)).write_bytes(b'x')
              timings={}
              for label,fn in [('baseline',old.measured_bytes),('patched',measured_bytes)]:
                  fn([root]); samples=[]
                  for _ in range(5):
                      start=time.perf_counter(); count=fn([root]); samples.append((time.perf_counter()-start)*1000)
                      assert count==12000
                  timings[label]={'milliseconds':samples,'medianMs':statistics.median(samples)}
              print('AUDIT101_QUOTA_BENCHMARK='+json.dumps(timings))
          PY
      - name: Scope
        if: always()
        run: echo 'NO_MAIN; NO_USER_INSTALLER; NO_RELEASE; NO_HISTORICAL_FULLTEST; NO_ARTIFACT_UPLOAD; FULL_QA_GATE_REQUIRED_SEPARATELY'
