name: AIO isolated EMZ WMZ page regression
on:
  push:
    branches: [work/emz-pages-20261029]
permissions:
  contents: write
concurrency:
  group: aio-emz-isolated
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  QT_QPA_PLATFORM: offscreen
  QT_OPENGL: software
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Verified Windows engine
        shell: pwsh
        run: ./tools/build/prepare-libreoffice.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'aio-metafile-engine')
      - name: Reproduce exact-base dangling pages and erased receipts
        shell: bash
        run: python tools/qa/fulltest_compressed_pages_native.py --executable "$AIO_QA_ENGINE" --output "$RUNNER_TEMP/aio-emz-before" --expect-broken
      - name: Apply exact-base edits in disposable checkout
        run: python tools/qa/_prepare_metafile_patch.py
      - name: New and preserved wrapper regressions
        shell: bash
        run: |
          python -m compileall -q app_backend tools tests
          python -m unittest discover -s tests -p test_compressed_metafile_pages.py -v
          python -m unittest discover -s tests -p test_guard_native_metafile_v17.py -v
      - name: Native compressed page acceptance
        shell: bash
        run: python tools/qa/fulltest_compressed_pages_native.py --executable "$AIO_QA_ENGINE" --output "$RUNNER_TEMP/aio-emz-after"
      - name: Existing native vector and colour regressions
        shell: bash
        run: |
          python tools/qa/fulltest_vector_pages_native.py --executable "$AIO_QA_ENGINE" --output "$RUNNER_TEMP/aio-emz-vector"
          python tools/qa/fulltest_pptx_colours_native.py --executable "$AIO_QA_ENGINE" --output "$RUNNER_TEMP/aio-emz-colour"
      - name: Show reviewed source diff
        shell: bash
        run: git diff --stat && git diff -- app_backend/converter_guard/adapter.py .github/workflows/aio-hosted-qa.yml
      - name: Publish tested unreferenced git blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/qa/_publish_metafile_blobs.py
