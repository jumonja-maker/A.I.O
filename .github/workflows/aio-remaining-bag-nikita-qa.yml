name: AIO remaining bag B19 B25 Before After pinned NIKITA acceptance

# This one-shot workflow is separate from existing application/build workflows.
# Owner authorized isolated Runner QA; only the fixed source below runs.
# No upload-artifact, hosted runner, package install, installer or release.
# Uses only existing tools and isolated source/evidence directories.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: aio-before-after-apng-source-final-selfhosted-qa
  cancel-in-progress: false

env:
  AIO_QA_SOURCE_SHA: eab87d675594139e997df90d1908287f83d03051
  AIO_QA_TREE_SHA: 6917f5ef846a56a28af3d3cc67780dfdab305e37
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PIP_NO_INDEX: '1'
  PIP_NO_INPUT: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  AIO_BLACKBOX_EVENTS: ''
  QT_QPA_PLATFORM: offscreen
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  windows-qa:
    if: >-
      github.repository == 'jumonja-maker/A.I.O' &&
      github.actor == 'jumonja-maker' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'aio-before-after-apng-source-final-selfhosted-qa' &&
      github.event.pull_request.number == 72 &&
      github.event.pull_request.user.login == 'jumonja-maker' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/b19-b25-before-after-viewer-20261027' &&
      github.event.pull_request.base.ref == 'fix/b16-b27-session-diagnostics-20261027'
    runs-on: [self-hosted, Windows, X64, local-d-manual]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - name: Verify restricted NIKITA host before checkout
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'NIKITA' -or $env:RUNNER_OS -cne 'Windows' -or $env:USERNAME -ine 'aio-runner') { throw 'Untrusted runner identity' }
          $principal=New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Elevated QA is forbidden' }
          foreach($key in @('GITHUB_WORKSPACE','RUNNER_TEMP','TEMP','TMP')) {
            $path=[Environment]::GetEnvironmentVariable($key)
            if ([string]::IsNullOrWhiteSpace($path) -or -not [IO.Path]::GetFullPath($path).StartsWith('D:\',[StringComparison]::OrdinalIgnoreCase)) { throw ($key+' must remain on D:') }
          }
          if ((Get-PSDrive -Name D -PSProvider FileSystem).Free -lt 30GB -or (Get-PSDrive -Name C -PSProvider FileSystem).Free -lt 10GB) { throw 'Required C/D free space unavailable' }
          foreach($name in @('aio-before-after-source-${{ github.run_id }}-${{ github.run_attempt }}','aio-before-after-evidence-${{ github.run_id }}-${{ github.run_attempt }}')) {
            if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $name)) { throw 'Run destination already exists' }
          }
      - name: Checkout immutable reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: jumonja-maker/A.I.O
          ref: eab87d675594139e997df90d1908287f83d03051
          path: aio-before-after-source-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          clean: true
      - name: Verify Git tree and select existing offline tools
        working-directory: aio-before-after-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $python='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\Scripts\python.exe'
          $marker='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\.00aio-test-only-venv.txt'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf) -or -not (Test-Path -LiteralPath $marker -PathType Leaf) -or (Get-Content -LiteralPath $marker -Raw).Trim() -cne '00AIO NIKITA ISOLATED DOCX PDF QA PY311 QT6103') { throw 'Trusted QA Python environment unavailable' }
          $verify=@'
          import hashlib, os
          from pathlib import Path
          def tree(folder):
              entries=[]
              for child in folder.iterdir():
                  if child.name=='.git':continue
                  key=child.name.encode('utf-8')
                  if child.is_symlink():raise ValueError('Unexpected symlink')
                  if child.is_dir():mode,oid,sort=b'40000',tree(child),key+b'/'
                  elif child.is_file():
                      data=child.read_bytes();mode=b'100644';sort=key
                      oid=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).digest()
                  else:raise ValueError('Unexpected file type')
                  entries.append((sort,mode+b' '+key+b'\0'+oid))
              raw=b''.join(row for _,row in sorted(entries,key=lambda item:item[0]))
              return hashlib.sha1(b'tree '+str(len(raw)).encode()+b'\0'+raw).digest()
          actual=tree(Path.cwd()).hex()
          print('AIO_VERIFIED_TREE='+actual)
          if actual!=os.environ['AIO_QA_TREE_SHA']:raise SystemExit('SOURCE_TREE_MISMATCH')
          '@
          & $python -c $verify
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source verification failed' }
          'AIO_QA_PYTHON='+$python | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $runnerRoot=Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)
          $node=Get-Command node -ErrorAction SilentlyContinue
          if ($node) {$node=$node.Source} else {
            $node=@(@((Join-Path $runnerRoot 'externals\node24\bin\node.exe'),(Join-Path $runnerRoot 'externals\node20\bin\node.exe'),'D:\AIO-Lab\nodejs\node.exe') | Where-Object {Test-Path -LiteralPath $_ -PathType Leaf} | Select-Object -First 1)
            if ($node.Count -ne 1) { throw 'Existing offline Node unavailable' };$node=$node[0]
          }
          [IO.Path]::GetDirectoryName($node) | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $links=@((Join-Path $env:GITHUB_WORKSPACE 'node_modules\linkedom\esm\index.js'),'D:\AIO-Lab\node_modules\linkedom\esm\index.js','D:\AIO-Lab\AIO-QA-Env\node_modules\linkedom\esm\index.js')
          $link=@($links | Where-Object {Test-Path -LiteralPath $_ -PathType Leaf} | Select-Object -First 1)
          if ($link.Count -eq 1) {'AIO_DOM_MODULE='+$link[0] | Out-File $env:GITHUB_ENV -Encoding utf8 -Append}
          $engine=$null
          foreach($base in @('D:\LBR\LibreOffice','D:\LBR','D:\AIO-Lab\LibreOffice','C:\Program Files\LibreOffice')) {
            foreach($leaf in @('program\soffice.com','program\soffice.exe')) {
              $candidate=Join-Path $base $leaf
              if ((Test-Path -LiteralPath $candidate -PathType Leaf) -and (Test-Path -LiteralPath (Join-Path $base 'program\soffice.bin') -PathType Leaf) -and (Test-Path -LiteralPath (Join-Path $base 'share') -PathType Container)) {$engine=$candidate;break}
            }
            if ($engine) {break}
          }
          if (-not $engine) {throw 'Existing complete native LibreOffice unavailable'}
          'AIO_QA_ENGINE='+$engine | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare verified offline test-only dependencies
        id: dependencies
        working-directory: aio-before-after-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:RUNNER_TEMP 'aio-before-after-deps-${{ github.run_id }}-${{ github.run_attempt }}-windows'
          & $env:AIO_QA_PYTHON tools/qa/guard_v17_test_dependencies.py --output $target --github-env
          if ($LASTEXITCODE -ne 0) {throw 'Offline test dependency preparation failed'}
      - name: Verify unchanged both DPI native viewer and neighbor product bytes
        working-directory: aio-before-after-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $verify=@'
          import hashlib,json,os
          from pathlib import Path
          def oid(path):
              if path.is_symlink():raise ValueError('Unexpected symlink')
              if path.is_file():
                  raw=path.read_bytes()
                  return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).digest()
              entries=[]
              for child in path.iterdir():
                  key=child.name.encode('utf-8');directory=child.is_dir()
                  entries.append((key+(b'/' if directory else b''),(b'40000' if directory else b'100644')+b' '+key+b'\0'+oid(child)))
              raw=b''.join(value for _,value in sorted(entries,key=lambda row:row[0]))
              return hashlib.sha1(b'tree '+str(len(raw)).encode()+b'\0'+raw).digest()
          from PySide6.QtGui import QImage,QColor
          old=QImage(2,2,QImage.Format.Format_RGBA8888);old.fill(0xffff0000)
          explicit=QImage(2,2,QImage.Format.Format_RGBA8888);explicit.fill(QColor(255,0,0,255))
          assert explicit.pixelColor(0,0).getRgb()==(255,0,0,255)
          print('RGBA_FIXTURE_CONTROL='+json.dumps({'legacyIntFill':old.pixelColor(0,0).getRgb(),'explicitQColor':explicit.pixelColor(0,0).getRgb()}))
          expected={'addons': '124e1aa0eb38c08e7d8f617ef91fc300b626d22f', 'app_backend': 'fb6dd44027f67c4ff38ef73fcf6b99e262fe8b29', 'assets': '207088b35bb505bb22f3160f0b1d96ba694fe795', 'index.html': '304c8ed1ce812153fa8d3b4b38c606a54263f1fe', 'launcher.py': '24d470fa43511a16f8f913ce7179591aa65c6bcf', 'src': '77f3195d48836c72c0852ced0ebe3c716caac715', 'tools/qa/guard_before_after_b19_b25_acceptance.py': '49b169b0c25f1d53ef2714841609e41187d6870b', 'tools/qa/guard_v08_native_acceptance.py': 'ee6cf590afa625eae12d9d3109c0676c477749cc', 'tools/qa/guard_v19_native_recipes_acceptance.py': 'afac0732aa2be950ea1cc95e8892a98754c1f0c3', 'tools/qa/guard_v19_visual_acceptance.py': '0a342c214ef81a09cd36549fbf44088f1f76e1e2', 'tools/qa/guard_v20_native_acceptance.py': '63c95293b436b5adecad450e8935471890ba6ae6', 'tools/qa/guard_v21_xlsx_acceptance.py': '9025384b51b23ef31c38150d0db9361acc36f4a9', 'tools/qa/guard_v22_txt_native_acceptance.py': '0e57814e709804f25f0b73dbb1e2f25583ca8c4e', 'tools/qa/guard_v19_journeys_acceptance.py': 'c1b7becccd0d3e31a8e3b1621420b4ad938e4f7f'}
          actual={key:oid(Path(key)).hex() for key in expected}
          if actual!=expected:raise SystemExit('PRIOR_NATIVE_PRODUCT_OR_GENERATORS_CHANGED')
          proof={'status':'PASS','scope':'native_product_and_generators_byte_identity_only','nativeSourceSHA':'14494e00fdbc1aaed20b8443b0d59e2554ea91df','nativeRunId':40579811557,'nativeRunConclusion':'failure_in_old_journey_filter_expectation','viewerDpi':[1,1.5],'viewerCasesPerDpi':5,'nativeNeighbors':'PASS','journeySourceSHA':'bdf6b0a189dfdbfa7131ecc4b5e2e98350f70fd0','journeyRunId':40581401851,'journeyRunConclusion':'failure_in_old_apng_source_colour_fixture','journeys':'PASS','productAndGenerators':actual,'currentSourceSHA':os.environ['AIO_QA_SOURCE_SHA']}
          out=Path(os.environ['GITHUB_WORKSPACE'])/'aio-before-after-evidence-${{ github.run_id }}-${{ github.run_attempt }}'
          out.mkdir(exist_ok=True,parents=True)
          (out/'native-continuity.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2),encoding='utf-8')
          print('NATIVE_CONTINUITY='+json.dumps(proof))
          '@
          & $env:AIO_QA_PYTHON -c $verify
          if ($LASTEXITCODE -ne 0) {throw 'Prior native viewer evidence does not apply to these product bytes'}
      - name: Full Windows source Qt DOM and Excel regressions
        working-directory: aio-before-after-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $env:AIO_LIBREOFFICE=$env:AIO_QA_ENGINE
          $env:AIO_LO_QA_MUST_HAVE_ENGINE='1'
          $env:AIO_QT_SAVE_QA='1'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'aio-before-after-evidence-${{ github.run_id }}-${{ github.run_attempt }}'
          & $env:AIO_QA_PYTHON tools/qa/guard_v17_selfhosted_acceptance.py --unit-report (Join-Path $evidence 'windows-unit.json')
          if ($LASTEXITCODE -ne 0) {throw 'Windows source Qt DOM regression failed'}
      - name: Record exact version and evidence also on failure
        if: always()
        working-directory: aio-before-after-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Continue'
          Write-Output ('AIO_TESTED_SHA='+$env:AIO_QA_SOURCE_SHA)
          Write-Output ('AIO_TESTED_TREE='+$env:AIO_QA_TREE_SHA)
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'aio-before-after-evidence-${{ github.run_id }}-${{ github.run_attempt }}'
          Get-ChildItem -LiteralPath $evidence -Filter '*.json' -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object {Write-Output ('AIO_EVIDENCE_FILE='+$_.FullName); Get-Content -LiteralPath $_.FullName -Raw}
