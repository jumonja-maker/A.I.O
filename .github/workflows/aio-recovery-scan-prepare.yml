name: AIO isolated recovery scan preparation
on:
  push:
    branches: ['work/recovery-scan-m02-20261029']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '.:tests'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Isolated test dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-save --ignore-scripts --package-lock=false linkedom@0.18.12
          echo "AIO_DOM_MODULE=$GITHUB_WORKSPACE/node_modules/linkedom/esm/index.js" >> "$GITHUB_ENV"
      - name: Reproduce baseline, test patch, create candidate without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/qa/_apply_recovery_scan_once.py
