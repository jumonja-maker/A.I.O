name: AIO isolated recovery scan preparation
on:
  push:
    branches: ['work/recovery-scan-m02-20261029']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '.:tests'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Isolated test dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-save --ignore-scripts --package-lock=false linkedom@0.18.12
          echo "AIO_DOM_MODULE=$GITHUB_WORKSPACE/node_modules/linkedom/esm/index.js" >> "$GITHUB_ENV"
      - name: Reproduce baseline, test patch, create candidate without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/qa/_apply_recovery_scan_once.py')
          text=path.read_text(encoding='utf-8')
          old="           'tests/recovery_scan_dom.mjs',"
          assert text.count(old)==1
          text=text.replace(old,old+"\n           'tests/guard_state_modal_v16.mjs',")
          old="    if(recoveryScan?.state==='scanning'&&bar?.isConnected&&bar.querySelector('.aio-guard-popup')?.open)"
          assert text.count(old)==1
          text=text.replace(old,"    if((recoveryScan?.state==='scanning'||recoveryScan?.state==='waiting_for_slot'&&storage?.cleanupPending>0)&&bar?.isConnected&&bar.querySelector('.aio-guard-popup')?.open)")
          path.write_text(text,encoding='utf-8')
          PY
          python tools/qa/_apply_recovery_scan_once.py
