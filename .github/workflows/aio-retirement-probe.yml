name: AIO isolated M16 M17 retirement probe
on:
  push:
    branches: ['work/retire-comparison-blackbox-20261030']
concurrency:
  group: aio-isolated-retirement
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
  QT_QPA_PLATFORM: offscreen
  QT_OPENGL: software
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --disable-gpu-compositing
  QTWEBENGINE_DISABLE_SANDBOX: '1'
  AIO_QT_SAVE_QA: '1'
  AIO_LO_QA_MUST_HAVE_ENGINE: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact-base candidate preparation
        shell: bash
        run: |
          set -euo pipefail
          python tools/qa/_prepare_retirement.py prepare
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/qa/_finalize_retirement.py')
          s=p.read_text(encoding='utf-8')
          old="    assert text.count(before)==count,(name,before[:80],text.count(before))"
          assert s.count(old)==1
          # The existing transfer-admission barrier already matches the exact
          # replacement; preserve it, do not duplicate or weaken it.
          s=s.replace(old,"    if text.count(before)==0 and text.count(after)==count:return\n"+old)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          python tools/qa/_finalize_retirement.py
          rm tools/qa/_finalize_retirement.py
          python -m compileall -q app_backend tools tests
          node --check src/guard-queue.js
          node --check src/converter-bridge.js
          git diff --check
          git diff --stat
      - name: Test dependencies and canonical disposable paths
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          npm install --no-save --ignore-scripts --package-lock=false linkedom@0.18.12
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()/'aio-retirement-tests';p.mkdir()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              for key in ('TEMP','TMP','TMPDIR'):f.write(key+'='+str(p)+'\n')
              f.write('AIO_DOM_MODULE='+str(pathlib.Path('node_modules/linkedom/esm/index.js').resolve())+'\n')
          PY
          echo "AIO_QA_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Linux native engine and Qt dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice python3-uno libegl1 libopengl0 libxkbcommon-x11-0 libnss3 libxcb-cursor0
          echo "AIO_LIBREOFFICE=$(command -v libreoffice)" >> "$GITHUB_ENV"
          echo "AIO_QA_ENGINE=$(command -v libreoffice)" >> "$GITHUB_ENV"
      - name: Pinned Windows native engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build/prepare-libreoffice.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'aio-engine-26.8.2')
      - name: New retirement boundary tests
        shell: bash
        run: python -m unittest discover -s tests -p test_module_retirement.py -v
      - name: Complete remaining source suite without masking failures
        shell: bash
        run: python tools/qa/hosted_unit_tests.py --report "$RUNNER_TEMP/aio-retirement-units.json"
      - name: Real Windows package and retained worker proof
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pyinstaller>=6.10,<7'
          python -m PyInstaller --noconfirm --clean AllInOne.spec
          python tools/qa/runtime_frozen_acceptance.py --executable dist/A.I.O/A.I.O.exe --output "$RUNNER_TEMP/aio-retirement-frozen" --seconds 120
      - name: Review actual shared-boundary diff
        shell: bash
        run: git diff -- app_backend/converter_guard/core.py app_backend/converter_guard/http_api.py app_backend/server.py app_backend/converter_transport.py launcher.py src/converter-bridge.js src/guard-queue.js AllInOne.spec
      - name: Publish reviewed candidate blobs and unreferenced tree only
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/qa/_prepare_retirement.py publish
