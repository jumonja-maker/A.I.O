name: AIO accepted retirement source transfer
on:
  push:
    branches: ['work/retire-comparison-blackbox-20261030']
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e2f63c160fa6a4f27b9482c7bcdb214b163f68a5
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reproduce exact accepted source bytes, not a new code candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e2f63c160fa6a4f27b9482c7bcdb214b163f68a5
          python tools/qa/_prepare_retirement.py prepare
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/qa/_finalize_retirement.py')
          s=p.read_text(encoding='utf-8')
          old="    assert text.count(before)==count,(name,before[:80],text.count(before))"
          assert s.count(old)==1
          s=s.replace(old,"    if text.count(before)==0 and text.count(after)==count:return\n"+old)
          old="p.open('a',encoding='utf-8')"
          assert s.count(old)==1
          s=s.replace(old,"p.open('a',encoding='utf-8',newline='\\n')")
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          python tools/qa/_finalize_retirement.py
          rm tools/qa/_finalize_retirement.py
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md');s=p.read_text(encoding='utf-8')
          old='> **Отдельный патч v19 — «до/после»:** добровольный анализ результатов,'
          assert s.count(old)==1
          new=('> **QA M16/M17, 30.10.2026:** «До/После» и BlackBox исключены из рабочего приложения.\n'
               '> Guard, технические отчёты, постоянная история и защита несохранённых результатов сохранены.\n'
               '> Код и тесты удалённых модулей: ветка `archive/beforeafter-blackbox-20261030`,\n'
               '> точный снимок `ad3492dd701082cf1d961a68d0d99de6a08457dd`. Это не изменение MAIN и не релиз.\n'
               '> [Область изменения и ограничения приёмки](docs/review/AIO_MODULE_RETIREMENT_M16_M17_2026-10-30_RU.md).\n\n'
               '> **Архивный патч v19 — «до/после» (не входит в текущую QA-сборку):** добровольный анализ результатов,')
          p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')
          p=Path('tools/qa/_prepare_retirement.py');s=p.read_text(encoding='utf-8')
          old="    result=request('/git/trees',{'base_tree':git('rev-parse',BASE+'^{tree}'),'tree':entries})"
          assert s.count(old)==1
          s=s.replace(old,"    result={'sha':None}\n    print('RETIREMENT_BASE_TREE='+git('rev-parse',BASE+'^{tree}'))")
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          git diff --check
      - name: Publish content-addressed blobs and manifest only, no refs or workflow tree writes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/qa/_prepare_retirement.py publish
          echo 'ACCEPTED_TEST_RUN=40975103065;WINDOWS_UNIT_AND_FROZEN=PASS;LINUX_UNIT=PASS;THIS_TRANSFER_IS_NOT_A_NEW_TEST_RUN'
