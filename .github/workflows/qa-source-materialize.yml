name: QA reviewed source edits (one shot)
on:
  push:
    branches: [fix/fulltest-critical-hosted-lo-20261029]
    paths: [tools/qa/materialize_fulltest_patch.py, .github/workflows/qa-source-materialize.yml]
permissions:
  contents: write
concurrency:
  group: aio-fulltest-source-edits-20261029
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'jumonja-maker/A.I.O' && github.actor == 'jumonja-maker' && contains(github.event.head_commit.message, 'materialize-reviewed-source')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply reviewed edits with immutable blob preconditions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/qa/materialize_fulltest_patch.py
          python3 -m compileall -q app_backend/converter_guard
          git diff --check
          git diff --exit-code -- .github
          git diff --stat
          git diff -- app_backend/converter_guard
      - name: Record ordinary source commit only on dedicated QA branch
        run: |
          set -euo pipefail
          branch='fix/fulltest-critical-hosted-lo-20261029'
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$GITHUB_SHA"
          python3 - <<'PY'
          import subprocess
          allowed={'app_backend/converter_guard/'+s for s in ['source_contract.py','uno_session.py','adapter.py','export_recipe.py','media_fidelity.py']}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed == allowed, changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_backend/converter_guard/source_contract.py app_backend/converter_guard/uno_session.py app_backend/converter_guard/adapter.py app_backend/converter_guard/export_recipe.py app_backend/converter_guard/media_fidelity.py
          git commit -m 'fix: native export fidelity for TGA, XHTML, pages, SYLK and JPEG'
          git push origin "HEAD:refs/heads/$branch"
          echo "AIO_PATCHED_SOURCE_SHA=$(git rev-parse HEAD)"
