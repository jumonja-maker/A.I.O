name: AIO isolated M05 M06 preparation
on:
  push:
    branches: ['work/ui-m05-m06-20261029']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '.:tests'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: DOM dependency
        run: |
          npm install --no-save --ignore-scripts --package-lock=false linkedom@0.18.12
          echo "AIO_DOM_MODULE=$GITHUB_WORKSPACE/node_modules/linkedom/esm/index.js" >> "$GITHUB_ENV"
      - name: Reproduce both defects and test candidate without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/qa/_apply_selection_once.py
