name: AIO B29 CSV text IDs Windows acceptance

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

concurrency:
  group: aio-b29-text-ids-nikita-once
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PIP_NO_INDEX: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  QT_QPA_PLATFORM: offscreen
  AIO_BLACKBOX_EVENTS: ''
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  B29_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  windows-text-ids:
    if: >-
      github.repository == 'jumonja-maker/A.I.O' &&
      github.actor == 'jumonja-maker' &&
      github.event.pull_request.user.login == 'jumonja-maker' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/guard-v23-b29-csv-text-ids-20261027' &&
      github.event.pull_request.base.ref == 'fix/guard-v182-matrix-progress-cancel-20261025'
    runs-on: [self-hosted, Windows, X64, local-d-manual]
    timeout-minutes: 50
    defaults:
      run:
        shell: powershell
        working-directory: b29-source-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify restricted runner and unique private workspace
        working-directory: .
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'NIKITA' -or $env:RUNNER_OS -cne 'Windows' -or $env:USERNAME -ine 'aio-runner') { throw 'Wrong QA runner identity' }
          $principal=New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Elevated QA forbidden' }
          foreach($key in @('GITHUB_WORKSPACE','RUNNER_TEMP','TEMP','TMP')) {
            $p=[Environment]::GetEnvironmentVariable($key)
            if ([string]::IsNullOrWhiteSpace($p) -or -not [IO.Path]::GetFullPath($p).StartsWith('D:\',[StringComparison]::OrdinalIgnoreCase)) { throw 'QA path must be on D:' }
          }
          if ((Get-PSDrive D -PSProvider FileSystem).Free -lt 10GB -or (Get-PSDrive C -PSProvider FileSystem).Free -lt 2GB) { throw 'Insufficient free space; no cleanup attempted' }
          if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'b29-source-${{ github.run_id }}-${{ github.run_attempt }}')) { throw 'Private workspace already exists' }

      - name: Checkout exact feature head with no persisted credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: b29-source-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 1

      - name: Select existing offline tools and seal source
        run: |
          $ErrorActionPreference='Stop'
          $python='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\Scripts\python.exe'
          $marker='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\.00aio-test-only-venv.txt'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf) -or -not (Test-Path -LiteralPath $marker -PathType Leaf) -or (Get-Content -LiteralPath $marker -Raw).Trim() -cne '00AIO NIKITA ISOLATED DOCX PDF QA PY311 QT6103') { throw 'Approved existing Python missing' }
          'AIO_QA_PYTHON='+$python | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $runnerRoot=Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)
          $node=Get-Command node -ErrorAction SilentlyContinue
          if ($node) {$node=$node.Source} else {
            $found=@(@((Join-Path $runnerRoot 'externals\node24\bin\node.exe'),(Join-Path $runnerRoot 'externals\node20\bin\node.exe'),'D:\AIO-Lab\nodejs\node.exe') | Where-Object {Test-Path -LiteralPath $_ -PathType Leaf} | Select-Object -First 1)
            if ($found.Count -ne 1) { throw 'Existing Node unavailable' };$node=$found[0]
          }
          [IO.Path]::GetDirectoryName($node) | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $engine=$null
          foreach($base in @('D:\LBR\LibreOffice','D:\LBR','D:\AIO-Lab\LibreOffice','C:\Program Files\LibreOffice')) {
            $candidate=Join-Path $base 'program\soffice.com'
            if ((Test-Path -LiteralPath $candidate -PathType Leaf) -and (Test-Path -LiteralPath (Join-Path $base 'program\soffice.bin') -PathType Leaf)) {$engine=$candidate;break}
          }
          if (-not $engine) { throw 'Existing LibreOffice missing' }
          'AIO_QA_ENGINE='+$engine | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'AIO_LIBREOFFICE='+$engine | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $deps=Join-Path $env:RUNNER_TEMP 'b29-deps-${{ github.run_id }}-${{ github.run_attempt }}'
          & $python tools/qa/guard_v17_test_dependencies.py --output $deps --github-env
          if ($LASTEXITCODE -ne 0) { throw 'Offline test dependencies failed' }
          $evidence=Join-Path $env:RUNNER_TEMP 'b29-evidence-${{ github.run_id }}-${{ github.run_attempt }}'
          if (Test-Path -LiteralPath $evidence) { throw 'Evidence destination exists' }
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          'B29_EVIDENCE='+$evidence | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $python tools/qa/_b29_evidence_once.py seal --evidence $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Source seal failed' }

      - name: New B29 positive negative cancellation and adapter tests
        run: |
          $ErrorActionPreference='Stop'
          & $env:AIO_QA_PYTHON -m unittest discover -s tests -p test_csv_text_ids_b29.py -v
          if ($LASTEXITCODE -ne 0) { throw 'B29 new regression failed' }

      - name: Exact 96 original routes plus 12 CLI controls and baseline parity
        run: |
          $ErrorActionPreference='Stop'
          & $env:AIO_QA_PYTHON tools/qa/guard_b29_csv_native_acceptance.py --output (Join-Path $env:B29_EVIDENCE 'native') --executable $env:AIO_QA_ENGINE
          if ($LASTEXITCODE -ne 0) { throw 'B29 native matrix failed' }

      - name: Full Windows source Qt and DOM regression
        run: |
          $ErrorActionPreference='Stop'
          $env:AIO_LO_QA_MUST_HAVE_ENGINE='1'
          $env:AIO_QT_SAVE_QA='1'
          & $env:AIO_QA_PYTHON tools/qa/guard_v17_selfhosted_acceptance.py --unit-report (Join-Path $env:B29_EVIDENCE 'unit.json')
          if ($LASTEXITCODE -ne 0) { throw 'Full Windows source regression failed' }

      - name: Preserve B28 DIF fix through 48 native cases
        run: |
          $ErrorActionPreference='Stop'
          & $env:AIO_QA_PYTHON tools/qa/guard_b28_dif_native_acceptance.py --output (Join-Path $env:B29_EVIDENCE 'dif') --executable $env:AIO_QA_ENGINE
          if ($LASTEXITCODE -ne 0) { throw 'B28 DIF regression failed' }

      - name: Native Writer TXT v20 XLSX and queue save regression
        run: |
          $ErrorActionPreference='Stop'
          & $env:AIO_QA_PYTHON tools/qa/guard_v22_txt_native_acceptance.py --output (Join-Path $env:B29_EVIDENCE 'txt-v22') --executable $env:AIO_QA_ENGINE --require-mode native_uno
          if ($LASTEXITCODE -ne 0) { throw 'TXT regression failed' }
          & $env:AIO_QA_PYTHON tools/qa/guard_v20_native_acceptance.py --output (Join-Path $env:B29_EVIDENCE 'native-v20') --executable $env:AIO_QA_ENGINE --require-mode native_uno
          if ($LASTEXITCODE -ne 0) { throw 'v20 regression failed' }
          & $env:AIO_QA_PYTHON tools/qa/guard_v21_xlsx_acceptance.py --output (Join-Path $env:B29_EVIDENCE 'xlsx-v21') --executable $env:AIO_QA_ENGINE --require-mode native_uno
          if ($LASTEXITCODE -ne 0) { throw 'XLSX regression failed' }
          & $env:AIO_QA_PYTHON tools/qa/guard_v08_native_acceptance.py --output (Join-Path $env:B29_EVIDENCE 'queue-v08') --compare-cli
          if ($LASTEXITCODE -ne 0) { throw 'Queue/save regression failed' }
          'PASS' | Set-Content -LiteralPath (Join-Path $env:B29_EVIDENCE 'other-gates-pass.txt') -Encoding ascii

      - name: Publish evidence only after all gates pass with feature-head lease
        env:
          B29_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          & $env:AIO_QA_PYTHON tools/qa/_b29_evidence_once.py publish --evidence $env:B29_EVIDENCE
          if ($LASTEXITCODE -ne 0) { throw 'Feature evidence publication failed' }

      - name: Record explicit scope
        if: always()
        run: |
          Write-Host 'B29_ONLY;NO_INSTALL_NO_BUILD_NO_RELEASE;USER_FULLTEST_NOT_RUN;MAIN_UNCHANGED'
          Write-Host ('EVIDENCE_PATH='+$env:B29_EVIDENCE)
