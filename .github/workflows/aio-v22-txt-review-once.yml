name: AIO v22 TXT loop and recovery UI targeted review

# Temporary, owner-directed patch authoring gate. Publishes only the reviewed
# feature branch after source/native checks. Never builds, installs or releases.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: aio-v22-txt-review-once
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PIP_NO_INDEX: '1'
  PIP_NO_INPUT: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  AIO_BLACKBOX_EVENTS: ''
  QT_QPA_PLATFORM: offscreen
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  reviewed-native-patch:
    if: >-
      github.repository == 'jumonja-maker/A.I.O' &&
      github.actor == 'jumonja-maker' &&
      github.event.pull_request.user.login == 'jumonja-maker' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/guard-v22-writer-txt-tail-recovery-ui-20261026' &&
      github.event.pull_request.base.ref == 'fix/guard-v182-matrix-progress-cancel-20261025'
    runs-on: [self-hosted, Windows, X64, local-d-manual]
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - name: Verify restricted host and new isolated working directories
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'NIKITA' -or $env:RUNNER_OS -cne 'Windows' -or $env:USERNAME -ine 'aio-runner') { throw 'Untrusted runner identity' }
          $principal=New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Elevated QA is forbidden' }
          foreach($key in @('GITHUB_WORKSPACE','RUNNER_TEMP','TEMP','TMP')) {
            $path=[Environment]::GetEnvironmentVariable($key)
            if ([string]::IsNullOrWhiteSpace($path) -or -not [IO.Path]::GetFullPath($path).StartsWith('D:\',[StringComparison]::OrdinalIgnoreCase)) { throw ($key+' must remain on D:') }
          }
          if ((Get-PSDrive -Name D -PSProvider FileSystem).Free -lt 30GB -or (Get-PSDrive -Name C -PSProvider FileSystem).Free -lt 10GB) { throw 'Required free space unavailable; no cleanup attempted' }
          foreach($name in @('aio-v22-txt-source-${{ github.run_id }}-${{ github.run_attempt }}','aio-v22-txt-evidence-${{ github.run_id }}-${{ github.run_attempt }}')) {
            if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $name)) { throw 'Run directory already exists; refusing overwrite' }
          }
      - name: Checkout the exact owner-requested feature source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: jumonja-maker/A.I.O
          ref: ${{ github.event.pull_request.head.sha }}
          path: aio-v22-txt-source-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          clean: true
      - name: Select existing offline Python Node and LibreOffice
        working-directory: aio-v22-txt-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $python='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\Scripts\python.exe'
          $marker='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\.00aio-test-only-venv.txt'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf) -or -not (Test-Path -LiteralPath $marker -PathType Leaf) -or (Get-Content -LiteralPath $marker -Raw).Trim() -cne '00AIO NIKITA ISOLATED DOCX PDF QA PY311 QT6103') { throw 'Trusted offline environment unavailable' }
          'AIO_QA_PYTHON='+$python | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $runnerRoot=Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)
          $node=Get-Command node -ErrorAction SilentlyContinue
          if ($node) {$node=$node.Source} else {
            $nodes=@(@((Join-Path $runnerRoot 'externals\node24\bin\node.exe'),(Join-Path $runnerRoot 'externals\node20\bin\node.exe'),'D:\AIO-Lab\nodejs\node.exe') | Where-Object {Test-Path -LiteralPath $_ -PathType Leaf} | Select-Object -First 1)
            if ($nodes.Count -ne 1) {throw 'Existing offline Node unavailable'};$node=$nodes[0]
          }
          [IO.Path]::GetDirectoryName($node) | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $links=@((Join-Path $env:GITHUB_WORKSPACE 'node_modules\linkedom\esm\index.js'),'D:\AIO-Lab\node_modules\linkedom\esm\index.js','D:\AIO-Lab\AIO-QA-Env\node_modules\linkedom\esm\index.js')
          $link=@($links | Where-Object {Test-Path -LiteralPath $_ -PathType Leaf} | Select-Object -First 1)
          if ($link.Count -eq 1) {'AIO_DOM_MODULE='+$link[0] | Out-File $env:GITHUB_ENV -Encoding utf8 -Append}
          $engine=$null
          foreach($base in @('D:\LBR\LibreOffice','D:\LBR','D:\AIO-Lab\LibreOffice','C:\Program Files\LibreOffice')) {
            foreach($leaf in @('program\soffice.com','program\soffice.exe')) {
              $candidate=Join-Path $base $leaf
              if ((Test-Path -LiteralPath $candidate -PathType Leaf) -and (Test-Path -LiteralPath (Join-Path $base 'program\soffice.bin') -PathType Leaf) -and (Test-Path -LiteralPath (Join-Path $base 'share') -PathType Container)) {$engine=$candidate;break}
            }
            if ($engine) {break}
          }
          if (-not $engine) {throw 'Complete existing LibreOffice unavailable'}
          'AIO_QA_ENGINE='+$engine | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'AIO_LIBREOFFICE='+$engine | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Apply only exact reviewed base changes and seal product bytes
        working-directory: aio-v22-txt-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'aio-v22-txt-evidence-${{ github.run_id }}-${{ github.run_attempt }}'
          & $env:AIO_QA_PYTHON tools/qa/_apply_txt_v22_review_once.py apply --evidence $evidence
          if ($LASTEXITCODE -ne 0) {throw 'Exact source anchors failed; no publication'}
          & $env:AIO_QA_PYTHON -m compileall -q app_backend tests/test_writer_text_tail_v22.py
          if ($LASTEXITCODE -ne 0) {throw 'Compile gate failed'}
          & node --check src/guard-queue.js
          if ($LASTEXITCODE -ne 0) {throw 'Queue JS parse failed'}
      - name: Prepare verified test-only offline dependencies
        working-directory: aio-v22-txt-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:RUNNER_TEMP 'aio-v22-txt-deps-${{ github.run_id }}-${{ github.run_attempt }}'
          & $env:AIO_QA_PYTHON tools/qa/guard_v17_test_dependencies.py --output $target --github-env
          if ($LASTEXITCODE -ne 0) {throw 'Offline dependencies unavailable'}
      - name: Actual Windows UNO and CLI Writer terminal-table TXT controls
        working-directory: aio-v22-txt-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'aio-v22-txt-evidence-${{ github.run_id }}-${{ github.run_attempt }}'
          & $env:AIO_QA_PYTHON tools/qa/guard_v22_txt_native_acceptance.py --output (Join-Path $evidence 'native-txt') --executable $env:AIO_QA_ENGINE --require-mode native_uno
          if ($LASTEXITCODE -ne 0) {throw 'Actual TXT controls failed; do not publish'}
      - name: Full Windows source Qt DOM and recovery warning regression
        working-directory: aio-v22-txt-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $env:AIO_LO_QA_MUST_HAVE_ENGINE='1'
          $env:AIO_QT_SAVE_QA='1'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'aio-v22-txt-evidence-${{ github.run_id }}-${{ github.run_attempt }}'
          & $env:AIO_QA_PYTHON tools/qa/guard_v17_selfhosted_acceptance.py --unit-report (Join-Path $evidence 'unit.json')
          if ($LASTEXITCODE -ne 0) {throw 'Full source regression failed or has unexplained skips'}
      - name: Preserve native v20 formats and quality checks
        working-directory: aio-v22-txt-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'aio-v22-txt-evidence-${{ github.run_id }}-${{ github.run_attempt }}'
          & $env:AIO_QA_PYTHON tools/qa/guard_v20_native_acceptance.py --output (Join-Path $evidence 'native-v20') --executable $env:AIO_QA_ENGINE --require-mode native_uno
          if ($LASTEXITCODE -ne 0) {throw 'Native v20 regression failed'}
      - name: Preserve queue save and CSV DBF native controls
        working-directory: aio-v22-txt-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'aio-v22-txt-evidence-${{ github.run_id }}-${{ github.run_attempt }}'
          & $env:AIO_QA_PYTHON tools/qa/guard_v08_native_acceptance.py --output (Join-Path $evidence 'native-v08') --compare-cli
          if ($LASTEXITCODE -ne 0) {throw 'Native queue/save regression failed'}
      - name: Publish tested source and evidence to the literal v22 feature branch only
        working-directory: aio-v22-txt-source-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AIO_PATCH_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'aio-v22-txt-evidence-${{ github.run_id }}-${{ github.run_attempt }}'
          & $env:AIO_QA_PYTHON tools/qa/_apply_txt_v22_review_once.py publish --evidence $evidence
          if ($LASTEXITCODE -ne 0) {throw 'Conditional feature-branch publication failed'}
      - name: Preserve exact result scopes without a release claim
        if: always()
        run: |
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'aio-v22-txt-evidence-${{ github.run_id }}-${{ github.run_attempt }}'
          Write-Output 'FULLTEST=NOT_RUN;EXE_BUILD=NOT_RUN;INSTALL=NOT_RUN;TELEMETRY=OFF;MAIN=UNCHANGED'
          Get-ChildItem -LiteralPath $evidence -Filter '*.json' -File -ErrorAction SilentlyContinue | ForEach-Object {Write-Output $_.Name;Get-Content -LiteralPath $_.FullName -Raw}
          Get-ChildItem -LiteralPath $evidence -Filter 'evidence.json' -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object {Write-Output $_.FullName;Get-Content -LiteralPath $_.FullName -Raw}
