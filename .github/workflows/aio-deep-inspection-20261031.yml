name: AIO independent deep inspection (diagnostic, not release gate)
on:
  push:
    branches: [audit/deep-inspection-20261031]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aio-deep-inspection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Canonical disposable audit TEMP
        shell: bash
        run: |
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()/'aio-audit-temp'
          p.mkdir(exist_ok=False)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              for key in ('TEMP','TMP','TMPDIR'):
                  f.write(key+'='+str(p)+'\n')
          PY
      - name: Verified runtime dependencies from existing lock
        shell: bash
        run: |
          set -euo pipefail
          echo "AIO_QA_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python tools/build/verify_qa_dependency_lock.py --phase runtime --check-locks
          AIO_QA_SOURCE_SHA=$(git rev-parse HEAD) python tools/build/qa_wheels.py --phase runtime --wheelhouse "$RUNNER_TEMP/aio-audit-wheels"
          npm install --no-save --ignore-scripts --package-lock=false linkedom@0.18.12
          python -c "from pathlib import Path; print('AIO_DOM_MODULE='+str(Path('node_modules/linkedom/esm/index.js').resolve()))" >> "$GITHUB_ENV"
      - name: Independent audit probes and source inventory (not release PASS)
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app_backend tools/qa/deep_inspection_20261031.py
          python -u tools/qa/deep_inspection_20261031.py
      - name: Declare scope honestly
        if: always()
        shell: bash
        run: echo 'AUDIT_ONLY=1;PRODUCT_CODE_MODIFIED=0;USER_FILES=NOT_USED;USER_INSTALLER=NOT_BUILT;HISTORICAL_FULLTEST=NOT_RUN;RELEASE_READY=NOT_ASSESSED_BY_WORKFLOW_STATUS'
