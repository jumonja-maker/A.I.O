name: "AIO Guard 0.8.1 BLACKBOX NIKITA QA"
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: aio-v081-blackbox-nikita
  cancel-in-progress: false
jobs:
  qa-package:
    if: >-
      github.repository == 'jumonja-maker/A.I.O' &&
      github.actor == 'jumonja-maker' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'aio-v081-blackbox-build-approved-once' &&
      github.event.pull_request.number == 15 &&
      github.event.pull_request.user.login == 'jumonja-maker' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/blackbox-deep-telemetry-v01-20261021' &&
      github.event.pull_request.base.ref == 'fix/guard-v081-audit-f01-f12-20261021'
    runs-on: [self-hosted, Windows, X64, local-d-manual]
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_INDEX: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      AIO_BUNDLE_PROFILE: lean
      AIO_LO_QA_BUILD: '0'
      AIO_BLACKBOX_EVENTS: ''
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check trusted NIKITA host before checkout
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if ($env:RUNNER_NAME -cne 'NIKITA' -or $env:RUNNER_OS -cne 'Windows' -or
              $env:USERNAME -ine 'aio-runner') { throw 'Restricted NIKITA runner only.' }
          $principal=New-Object Security.Principal.WindowsPrincipal(
            [Security.Principal.WindowsIdentity]::GetCurrent())
          if ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Admin build is forbidden.'
          }
          foreach ($key in @('GITHUB_WORKSPACE','RUNNER_TEMP','TEMP','TMP')) {
            $dir=[Environment]::GetEnvironmentVariable($key)
            if ([string]::IsNullOrWhiteSpace($dir) -or
                -not [IO.Path]::GetFullPath($dir).StartsWith('D:\',[StringComparison]::OrdinalIgnoreCase)) {
              throw ($key+' must reside on D:')
            }
          }
          foreach ($spec in @(@('C',10),@('D',30))) {
            if ((Get-PSDrive -PSProvider FileSystem -Name $spec[0]).Free -lt
                [double]$spec[1]*1GB) { throw 'Insufficient free disk.' }
          }
          if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'aio-pin-${{ github.run_id }}')) {
            throw 'Refusing existing checkout destination.'
          }
          Write-Host 'NIKITA_PREFLIGHT=PASS'

      - name: Checkout immutable Guard 0.8.1 plus BLACKBOX snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: jumonja-maker/A.I.O
          ref: 982c28395e80b1ed94702ece4d369cc0edf91e7e
          path: aio-pin-${{ github.run_id }}
          persist-credentials: false
          clean: true

      - name: Verify exact Git tree before any application execution
        working-directory: aio-pin-${{ github.run_id }}
        run: |
          $ErrorActionPreference='Stop'
          $python='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\Scripts\python.exe'
          $marker='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\.00aio-test-only-venv.txt'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf) -or
              -not (Test-Path -LiteralPath $marker -PathType Leaf) -or
              (Get-Content -LiteralPath $marker -Raw).Trim() -cne
                 '00AIO NIKITA ISOLATED DOCX PDF QA PY311 QT6103') {
            throw 'Trusted offline QA environment missing.'
          }
          $verifier=@'
          import hashlib,sys
          from pathlib import Path
          def digest(directory):
              parts=[]
              for child in directory.iterdir():
                  if child.name=='.git':continue
                  key=child.name.encode('utf-8')
                  if child.is_symlink():raise ValueError('Symlink forbidden')
                  if child.is_dir():
                      mode,oid,sort=b'40000',digest(child),key+b'/'
                  elif child.is_file():
                      data=child.read_bytes()
                      oid=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).digest()
                      mode,sort=b'100644',key
                  else:raise ValueError('Unexpected file type')
                  parts.append((sort,mode+b' '+key+b'\0'+oid))
              raw=b''.join(value for _,value in sorted(parts,key=lambda item:item[0]))
              return hashlib.sha1(b'tree '+str(len(raw)).encode()+b'\0'+raw).digest()
          actual=digest(Path.cwd()).hex()
          print('PINNED_TREE_SHA1='+actual)
          if actual!=sys.argv[1]:raise SystemExit('TREE_MISMATCH')
          '@
          $script=Join-Path $env:RUNNER_TEMP ('aio-pin-'+$env:GITHUB_RUN_ID+'.py')
          if (Test-Path -LiteralPath $script) { throw 'Verifier filename collision.' }
          try {
            [IO.File]::WriteAllText($script,$verifier,[Text.UTF8Encoding]::new($false))
            & $python $script 'c225812d703579b418da9284ec47182aaa5ed3e9'
            if ($LASTEXITCODE -ne 0) { throw 'Source snapshot rejected.' }
          } finally {
            Remove-Item -LiteralPath $script -Force -ErrorAction SilentlyContinue
          }
          & $python -c 'import sys,openpyxl,PyInstaller,PySide6.QtWebEngineWidgets; assert sys.version_info[:2]==(3,11)'
          if ($LASTEXITCODE -ne 0) { throw 'Offline Python dependency missing.' }
          $lo=$null
          foreach ($dir in @('D:\LBR\LibreOffice','D:\LBR','D:\AIO-Lab\LibreOffice',
               'C:\Program Files\LibreOffice')) {
            if ((Test-Path -LiteralPath (Join-Path $dir 'program\soffice.exe') -PathType Leaf) -and
                (Test-Path -LiteralPath (Join-Path $dir 'program\soffice.bin') -PathType Leaf) -and
                (Test-Path -LiteralPath (Join-Path $dir 'share') -PathType Container) -and
                @(Get-ChildItem -LiteralPath $dir -Filter 'LICENSE*' -File -Recurse -ErrorAction Stop).Count -gt 0) {
              $lo=$dir;break
            }
          }
          if (-not $lo) { throw 'Verified complete LibreOffice missing.' }
          'AIO_LIBREOFFICE_ROOT='+$lo | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $dir='D:\AIO-Lab\AIO-QA-Env\inno-673-portable\compiler'
          $compiler=@(Get-ChildItem -LiteralPath $dir -Filter ISCC.exe -File -Recurse -ErrorAction Stop)
          if ($compiler.Count -ne 1) { throw 'Trusted Inno compiler missing.' }
          'AIO_APPROVED_ISCC='+$compiler[0].FullName | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'SOURCE_SHA=982c28395e80b1ed94702ece4d369cc0edf91e7e'
          Write-Host 'OFFLINE_DEPENDENCIES=PASS'

      - name: Compile Python, run all regressions and BLACKBOX stress QA
        id: tests
        working-directory: aio-pin-${{ github.run_id }}
        run: |
          $ErrorActionPreference='Stop'
          $python='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\Scripts\python.exe'
          & $python -m compileall -q app_backend launcher.py tests
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_COMPILE_FAILED' }
          & $python -m unittest discover -s tests -p test_guard_audit_v081.py -v
          if ($LASTEXITCODE -ne 0) { throw 'GUARD_AUDIT_REGRESSIONS_FAILED' }
          & $python -m unittest discover -s tests -p test_blackbox_telemetry.py -v
          if ($LASTEXITCODE -ne 0) { throw 'BLACKBOX_REGRESSIONS_FAILED' }
          & $python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'FULL_TEST_SUITE_FAILED' }
          Write-Host 'AUDIT_BLACKBOX_FULL_SUITE=PASS'

      - name: Actual Windows LibreOffice v0.8 native acceptance
        id: native
        working-directory: aio-pin-${{ github.run_id }}
        run: |
          $ErrorActionPreference='Stop'
          $python='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\Scripts\python.exe'
          $env:AIO_LO_QA_MUST_HAVE_ENGINE='1'
          & $python tools/qa/guard_v06_windows_preflight_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_PREFLIGHT_V06_FAILED' }
          & $python tools/qa/guard_v07_windows_preflight_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_PREFLIGHT_V07_FAILED' }
          $evidence=Join-Path $env:GITHUB_WORKSPACE ('aio-v081-evidence-'+$env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $evidence) { throw 'Evidence dir already exists.' }
          & $python tools/qa/guard_v08_native_acceptance.py --output $evidence --compare-cli
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_V08_ACCEPTANCE_FAILED' }
          Write-Host 'NIKITA_WINDOWS_NATIVE_11_EXPORTS=PASS'

      - name: Package portable ZIP and versioned Windows QA installer
        id: package
        working-directory: aio-pin-${{ github.run_id }}
        run: |
          $ErrorActionPreference='Stop'
          $python='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\Scripts\python.exe'
          foreach ($file in @('assets\brand\icons\aio.ico',
              'assets\brand\elva-v13-happy-256.png',
              'app_backend\blackbox_telemetry.py',
              'app_backend\converter_guard\core.py',
              'tests\test_blackbox_telemetry.py')) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw ('Component missing: '+$file)
            }
          }
          $env:PYINSTALLER_CONFIG_DIR=Join-Path $env:RUNNER_TEMP ('aio-v081-pyinst-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $env:PYINSTALLER_CONFIG_DIR | Out-Null
          & $python -m PyInstaller --noconfirm --clean AllInOne.spec
          if ($LASTEXITCODE -ne 0) { throw 'PYINSTALLER_FAILED' }
          foreach ($item in @('dist\A.I.O\A.I.O.exe',
              'dist\A.I.O\_internal\libreoffice\program\soffice.exe',
              'dist\A.I.O\_internal\libreoffice\program\soffice.bin',
              'dist\A.I.O\_internal\assets\brand\icons\aio.ico')) {
            if (-not (Test-Path -LiteralPath $item -PathType Leaf)) {
              throw ('Bundle incomplete: '+$item)
            }
          }
          if (-not (Test-Path -LiteralPath 'dist\A.I.O\_internal\libreoffice\share' -PathType Container)) {
            throw 'LibreOffice share directory missing.'
          }
          New-Item -ItemType Directory -Force -Path 'build\installer' | Out-Null
          $portable='build\installer\AIO-Guard-v081-BLACKBOX-QA-PORTABLE.zip'
          Compress-Archive -LiteralPath 'dist\A.I.O' -DestinationPath $portable -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $portable -PathType Leaf)) { throw 'Portable missing.' }
          $iss='installer\windows\AIO-Guard-QA.iss'
          $original=Get-Content -LiteralPath $iss -Raw
          $changed=$original.Replace('#define AppVersion "0.7.0-guard-qa"',
              '#define AppVersion "0.8.1-blackbox-qa"').Replace(
              'OutputBaseFilename=AIO-Guard-QA-win-x64',
              'OutputBaseFilename=AIO-Guard-v081-BLACKBOX-QA-win-x64')
          if ($changed -ceq $original) { throw 'Version metadata not updated.' }
          [IO.File]::WriteAllText((Join-Path (Get-Location).Path $iss),
              $changed,[Text.UTF8Encoding]::new($false))
          & $env:AIO_APPROVED_ISCC $iss
          if ($LASTEXITCODE -ne 0) { throw 'INNO_QA_FAILED' }
          $setup='build\installer\AIO-Guard-v081-BLACKBOX-QA-win-x64.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'Installer missing.' }
          @($setup,$portable) | ForEach-Object {
            (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()+
              '  '+[IO.Path]::GetFileName($_)
          } | Set-Content -LiteralPath 'build\installer\SHA256SUMS.txt' -Encoding ascii
          @('SOURCE=982c28395e80b1ed94702ece4d369cc0edf91e7e','TREE=c225812d703579b418da9284ec47182aaa5ed3e9','GUARD=V0.8.1-PR14',
            'BLACKBOX=TELEMETRY-V0.1-PR15','LIBREOFFICE=BUNDLED',
            'NATIVE_WINDOWS_QA=PASS','INSTALLED=NO;RELEASED=NO;MAIN=UNCHANGED') |
              Set-Content -LiteralPath 'build\installer\BUILD-STATUS.txt' -Encoding utf8
          Get-Content -LiteralPath 'build\installer\SHA256SUMS.txt' |
              ForEach-Object { Write-Host ('QA_SHA256='+$_) }
          @($setup,$portable) | ForEach-Object {
            $info=Get-Item -LiteralPath $_
            Write-Host ('QA_PACKAGE='+$info.Name+';BYTES='+$info.Length)
          }
          Write-Host ('QA_LOCAL_PACKAGE_PATH='+(Resolve-Path 'build\installer').Path)
          Write-Host 'NO_INSTALL_NO_RELEASE'

      - name: Private artifact upload (independent of package success)
        id: upload
        if: steps.package.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AIO-V081-BLACKBOX-QA-${{ github.run_id }}
          path: |
            aio-pin-${{ github.run_id }}/build/installer/AIO-Guard-v081-BLACKBOX-QA-win-x64.exe
            aio-pin-${{ github.run_id }}/build/installer/AIO-Guard-v081-BLACKBOX-QA-PORTABLE.zip
            aio-pin-${{ github.run_id }}/build/installer/SHA256SUMS.txt
            aio-pin-${{ github.run_id }}/build/installer/BUILD-STATUS.txt
          retention-days: 7
          if-no-files-found: error

      - name: Report separate test, package and upload outcomes
        if: always()
        run: |
          Write-Host 'PINNED_SOURCE=982c28395e80b1ed94702ece4d369cc0edf91e7e'
          Write-Host 'TESTS=${{ steps.tests.outcome }}'
          Write-Host 'NATIVE=${{ steps.native.outcome }}'
          Write-Host 'PACKAGE=${{ steps.package.outcome }}'
          Write-Host 'UPLOAD=${{ steps.upload.outcome }}'
          Write-Host 'NO_INSTALL_NO_RELEASE_NO_MAIN_MERGE'
          if ('${{ steps.package.outcome }}' -ne 'success') { throw 'QA build blocked or failed.' }
          if ('${{ steps.upload.outcome }}' -ne 'success') {
            Write-Warning 'Package may be available only in local D: QA workspace.'
          }
