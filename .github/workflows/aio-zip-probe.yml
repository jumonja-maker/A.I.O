name: AIO isolated ZIP readback and snapshot regression
on:
  push:
    branches: [work/zip-readback-20261029]
permissions:
  contents: write
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Canonical temporary directory
        shell: bash
        run: |
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()/'aio-tests-temp'
          p.mkdir(exist_ok=False)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              for k in ('TEMP','TMP','TMPDIR'): f.write(k+'='+str(p)+'\n')
          PY
      - name: Reproduce both defects on unchanged product base
        run: python tools/qa/_prepare_zip_patch.py reproduce
      - name: Apply exact-base candidate in disposable checkout
        run: python tools/qa/_prepare_zip_patch.py prepare
      - name: New ZIP policy and core regressions
        shell: bash
        run: |
          python -m compileall -q app_backend tests
          python -m unittest discover -s tests -p test_archive_readback.py -v
      - name: Preserved ownership folder-save and metafile tests
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_converter_guard_v02.py -v
          python -m unittest discover -s tests -p test_save_snapshot_report.py -v
          python -m unittest discover -s tests -p test_compressed_metafile_pages.py -v
      - name: Review exact product integration diff
        shell: bash
        run: git diff --check && git diff -- app_backend/converter_guard/core.py
      - name: Publish tested unreferenced source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/qa/_prepare_zip_patch.py publish
