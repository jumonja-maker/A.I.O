name: 00AIO compose immutable candidate only
on:
  pull_request:
    types: [synchronize, reopened]
permissions:
  contents: write
jobs:
  compose:
    if: >-
      github.repository == 'jumonja-maker/A.I.O' && github.actor == 'jumonja-maker' &&
      github.event.pull_request.number == 73 &&
      github.event.pull_request.user.login == 'jumonja-maker' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/remaining-bag-stress3-20261027' &&
      github.event.pull_request.base.ref == 'fix/guard-v182-matrix-progress-cancel-20261025'
    runs-on: [self-hosted, Windows, X64, local-d-manual]
    timeout-minutes: 10
    steps:
      - name: Non-elevated owner runner and unused directory
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'NIKITA' -or $env:USERNAME -ine 'aio-runner') { throw 'Unexpected runner' }
          $p=New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if ($p.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Elevated runner prohibited' }
          if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'c-${{ github.run_id }}-${{ github.run_attempt }}')) { throw 'Destination already exists' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: c-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - name: Resolve only literal test-branch UNO conflict and preserve both parents
        shell: powershell
        working-directory: c-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GH_TOKEN: ${{ github.token }}
          AIO_COMPOSE_HEAD: a176f4c859b91b12173aad8a232b77d9cfe82abd
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          $python='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\Scripts\python.exe'
          $marker='D:\AIO-Lab\AIO-QA-Env\docx-py311-qt6103\.00aio-test-only-venv.txt'
          if (-not (Test-Path -LiteralPath $marker) -or (Get-Content -LiteralPath $marker -Raw).Trim() -cne '00AIO NIKITA ISOLATED DOCX PDF QA PY311 QT6103') { throw 'Untrusted environment' }
          & $python tools/qa/_compose_owned_process_integration.py
          if ($LASTEXITCODE -ne 0) { throw 'Composition failed; no product QA or main changes' }
